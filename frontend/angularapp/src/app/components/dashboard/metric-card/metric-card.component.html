<article class="metric-card">
  <div class="metric-card-top">
    <span class="metric-card-title">{{ title }}</span>
    <span class="metric-card-icon" aria-hidden="true">{{ icon }}</span>
  </div>

  <p class="metric-card-value">{{ value }}</p>

  <p class="metric-card-description">{{ description }}</p>
</article>
