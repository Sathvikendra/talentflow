<div class="requirement-filters">

  <div>
    <label for="requirementSearch">Search</label>
    <input
      id="requirementSearch"
      type="text"
      placeholder="Search RR number, title or location"
      [value]="filters.search"
      (input)="updateFilter('search', $any($event.target).value)">
  </div>

  <div>
    <label for="requirementStatus">Status</label>
    <select
      id="requirementStatus"
      [value]="filters.status"
      (change)="updateFilter('status', $any($event.target).value)">

      <option value="">All Statuses</option>
      <option value="OPEN">Open</option>
      <option value="FILLED">Filled</option>
      <option value="CLOSED">Closed</option>
    </select>
  </div>

  <div>
    <label for="requirementPriority">Priority</label>
    <select
      id="requirementPriority"
      [value]="filters.priority"
      (change)="updateFilter('priority', $any($event.target).value)">

      <option value="">All Priorities</option>
      <option value="HIGH">High</option>
      <option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option>
    </select>
  </div>

  <div>
    <label for="requirementWorkMode">Work Mode</label>
    <select
      id="requirementWorkMode"
      [value]="filters.workMode"
      (change)="updateFilter('workMode', $any($event.target).value)">

      <option value="">All Work Modes</option>
      <option value="ONSITE">Onsite</option>
      <option value="REMOTE">Remote</option>
      <option value="HYBRID">Hybrid</option>
    </select>
  </div>

  <button type="button" (click)="clearFilters()">
    Clear Filters
  </button>

</div>
